services:
  - type: web
    name: agent-lab-ignac
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /api/*
        destination: https://agent-lab-api-ignac.vercel.app/api/*
      - type: rewrite
        source: /*
        destination: /index.html
